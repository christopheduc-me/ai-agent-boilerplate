[project]
name = "aiagent"
version = "0.1.0"
description = "Research agent: LangChain + Celery workers behind a FastAPI micro-API"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6",
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "httpx>=0.28",
    "langchain-anthropic>=1.5",
    "langchain-tavily>=0.2.18",
    "ddgs>=9.14",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-celery>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "langchain-ollama>=1.1.0",
    "pydantic>=2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-redis>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "respx>=0.23",
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langchain_anthropic.*", "langchain_tavily.*", "celery.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "aiagent.adapters.tavily",
    "aiagent.adapters.llm",
    "aiagent.tasks",
    "aiagent.celery_app",
    "aiagent.telemetry",
]
disallow_untyped_calls = false
disallow_untyped_decorators = false
