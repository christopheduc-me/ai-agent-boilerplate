# Serves the built SPA and proxies /api to the Rust backend (ADR-014).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend on each request through Docker's embedded DNS.
    # A literal proxy_pass hostname is resolved once at startup and cached
    # forever: recreating the backend container (new IP) then 502s every API
    # call until nginx restarts. The variable indirection forces re-resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        # Security headers on the SPA responses (ADR-054). `always` covers error
        # responses too. The API sets its own (stricter) headers; these are the
        # app's CSP. connect-src 'self' allows the same-origin /api + SSE; the
        # Vite build ships external JS/CSS, with inline styles from Vue SFCs.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
