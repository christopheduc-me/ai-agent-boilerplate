# Default profile (infra): PostgreSQL + Redis only — apps run locally for hot-reload.
# Full stack: docker compose --profile full up --build
# Traces (ADR-029): add --profile observability and point the services at Jaeger:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 \
#     docker compose --profile full --profile observability up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: aiagent
    ports:
      # Host port 5433 to avoid clashing with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aiagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["full"]
    build: ./backend
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/aiagent
      AGENT_API_URL: http://agent-api:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      BIND_ADDR: 0.0.0.0:8000
      # Abuse protection (ADR-017), passed through so e2e can loosen them.
      DAILY_SEARCH_QUOTA: ${DAILY_SEARCH_QUOTA:-20}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      # Background loop cadence (reaper + recurring scheduler, ADR-033).
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-60}
      # Traces (ADR-029): empty = disabled.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-api:
    profiles: ["full"]
    build: ./agent
    command: ["uvicorn", "aiagent.adapters.api.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-worker:
    profiles: ["full"]
    build: ./agent
    command: ["celery", "-A", "aiagent.celery_app", "worker", "--loglevel=info"]
    environment:
      REDIS_URL: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AGENT_MODEL_ID: ${AGENT_MODEL_ID:-claude-opus-4-8}
      # "fake" = deterministic keyless providers (e2e / keyless dev, ADR-021).
      AGENT_PROVIDERS: ${AGENT_PROVIDERS:-live}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A aiagent.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Local trace backend (ADR-029): Jaeger v2 receives OTLP natively on 4318
  # and serves its UI on http://localhost:16686. Dev-only — production points
  # OTEL_EXPORTER_OTLP_ENDPOINT at your own collector, if any.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.19.0
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/HTTP (also for bricks running on the host)

volumes:
  pgdata:
