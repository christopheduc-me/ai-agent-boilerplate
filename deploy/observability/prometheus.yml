# Prometheus scrape config (ADR-050), dev-only. Pulls the metrics the OTel
# Collector re-exposes from the OTLP pushes of the backend and the agent.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules (ADR-068). Firing state shows at :9090/alerts; routing them to
# a human needs Alertmanager, which this profile does not ship.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
