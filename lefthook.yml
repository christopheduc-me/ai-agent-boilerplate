# Pre-commit hooks (ADR-022: lefthook is a single multi-platform Go binary).
# Install once: `lefthook install` (after `brew install lefthook` or equivalent).
# Bypass for a WIP commit: `git commit --no-verify`.
#
# Kept fast on purpose: formatters/linters only — the full test suites and
# clippy stay in CI (and in docs/COMMANDS.md for manual runs).
pre-commit:
  parallel: true
  commands:
    backend-fmt:
      glob: "backend/**/*.rs"
      run: cd backend && cargo fmt --check
    agent-lint:
      glob: "agent/**/*.py"
      run: cd agent && uv run ruff check . && uv run ruff format --check .
    frontend-lint:
      glob: "frontend/src/**/*.{ts,vue}"
      run: cd frontend && npm run lint
    secrets:
      run: |
        if command -v gitleaks >/dev/null; then
          gitleaks protect --staged --no-banner --redact
        else
          echo "gitleaks not installed — secret scan skipped (weekly CI audit still covers it)"
        fi
