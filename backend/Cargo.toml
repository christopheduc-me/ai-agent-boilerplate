[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
# `rustls-no-provider` + an explicit ring provider (ADR-064): the plain `rustls`
# feature would pull aws-lc-rs, whose build needs cmake/clang in the image.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Email digest channel (ADR-062): SMTP over STARTTLS with rustls (no OpenSSL).
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
# pgvector type mapping for sqlx (ADR-063: RAG knowledge base).
pgvector = { version = "0.4", default-features = false, features = ["sqlx"] }
dotenvy = "0.15"
sha2 = "0.11.0"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.1", features = ["metrics"] }
tracing-opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
redis = { version = "1.4.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
hmac = "0.13.0"
# OpenAPI documentation (ADR-049 amendment). `utoipa` is a representation-level
# derive (like serde, no I/O) so it may annotate domain wire types; the Swagger
# UI is an adapter concern. `vendored` bundles the UI assets — no build-time
# network fetch, self-hosted at /api/docs.
utoipa = { version = "5", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Integration tests implement async ports (e.g. a not-ready ReadinessProbe).
async-trait = "0.1"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "healthcheck"
path = "src/bin/healthcheck.rs"
