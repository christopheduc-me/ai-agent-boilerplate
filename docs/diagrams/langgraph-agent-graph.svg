<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="771px" preserveAspectRatio="none" style="width:1014px;height:771px;background:#FFFFFF;" version="1.1" viewBox="0 0 1014 771" width="1014px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="entity" data-qualified-name="decide" data-source-line="10" id="ent0001"><rect fill="#F1F1F1" height="69.4648" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="237.6426" x="311.53" y="214.87"/><line style="stroke:#181818;stroke-width:0.5;" x1="311.53" x2="549.1726" y1="241.3583" y2="241.3583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.4404" x="408.1311" y="233.4052">decide</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.6426" x="316.53" y="259.8934">policy.decide(goal, journal, hits)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.7188" x="316.53" y="276.3817">the LLM picks the next action</text></g><g class="entity" data-qualified-name="search" data-source-line="11" id="ent0002"><rect fill="#F1F1F1" height="85.9531" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="305.7627" x="67.47" y="391.33"/><line style="stroke:#181818;stroke-width:0.5;" x1="67.47" x2="373.2327" y1="417.8183" y2="417.8183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="44.2559" x="198.2234" y="409.8652">search</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.9063" x="72.47" y="436.3534">provider.search(query)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="264.9268" x="72.47" y="452.8417">dedup by canonical URL, keep new hits</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="285.7627" x="72.47" y="469.33">journal &#171;search&#187; (query, reason, new_hits)</text></g><g class="entity" data-qualified-name="ask" data-source-line="12" id="ent0003"><rect fill="#F1F1F1" height="69.4648" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="260.7002" x="7" y="22.2"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="267.7002" y1="48.6883" y2="48.6883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="23.0508" x="125.8247" y="40.7352">ask</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.0781" x="12" y="67.2234">interrupt(question)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.7002" x="12" y="83.7117">pause for the user (HITL, ADR-032)</text></g><g class="entity" data-qualified-name="finalize" data-source-line="13" id="ent0004"><rect fill="#F1F1F1" height="52.9766" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.8164" x="426.44" y="407.82"/><line style="stroke:#181818;stroke-width:0.5;" x1="426.44" x2="610.2564" y1="434.3083" y2="434.3083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.5332" x="493.5816" y="426.3552">finalize</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.8164" x="431.44" y="452.8434">journal &#171;finish&#187; (reason)</text></g><g class="entity" data-qualified-name="critique" data-source-line="14" id="ent0005"><rect fill="#F1F1F1" height="85.9531" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="336.9414" x="349.88" y="538.28"/><line style="stroke:#181818;stroke-width:0.5;" x1="349.88" x2="686.8214" y1="564.7683" y2="564.7683"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.5293" x="492.5861" y="556.8152">critique</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="248.0557" x="354.88" y="583.3034">critic.critique(goal, hits) &#8212; ADR-031</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="316.9414" x="354.88" y="599.7917">drop off-topic, one repair search if budget left</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="210.7793" x="354.88" y="616.28">journal &#171;critique&#187; (assessment)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="16" id="ent0006"><ellipse cx="702.35" cy="56.94" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="26" id="ent0014"><ellipse cx="406.35" cy="720.86" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="406.35" cy="720.86" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN16" data-source-line="29" id="ent0017"><path d="M302.46,6 L302.46,52.94 L267.94,56.94 L302.46,60.94 L302.46,107.8633 A0,0 0 0 0 302.46,107.8633 L656.2486,107.8633 A0,0 0 0 0 656.2486,107.8633 L656.2486,16 L646.2486,6 L302.46,6 A0,0 0 0 0 302.46,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M646.2486,6 L646.2486,16 L656.2486,16 L646.2486,6" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="157.1172" x="308.46" y="23.5684">interrupt() = the pause.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="127.2642" x="469.6905" y="23.5684">The worker sees the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.8291" x="308.46" y="38.8789">interrupt, fires POST /internal/jobs/{id}/question</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.647" x="308.46" y="54.1895">once (job -&gt; awaiting_input) and the task ends.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.7886" x="308.46" y="69.5">The user's answer re-dispatches a task that resumes</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="25.3843" x="308.46" y="84.8105">this</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.2866" x="337.9576" y="84.8105">graph from its Redis checkpoint &#8212; the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.269" x="308.46" y="100.1211">searches done before the pause are not redone.</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="38" id="ent0020"><path d="M645.28,398.69 L645.28,469.9322 L999.4113,469.9322 L999.4113,408.69 L989.4113,398.69 L645.28,398.69" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M989.4113,398.69 L989.4113,408.69 L999.4113,408.69 L989.4113,398.69" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="130.311" x="651.28" y="416.2584">Durable checkpoint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.9233" x="785.7043" y="416.2584">after every super-step:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.1313" x="651.28" y="431.5689">Redis, keyed by job_id (ADR-046). The checkpointed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.5034" x="651.28" y="446.8795">state holds JSON primitives only (hits/steps as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.2441" x="651.28" y="462.19">dicts) &#8212; no pickling of domain dataclasses.</text></g><g class="entity" data-qualified-name="GMN22" data-source-line="45" id="ent0023"><path d="M452.07,685.24 L452.07,756.4822 A0,0 0 0 0 452.07,756.4822 L808.6325,756.4822 A0,0 0 0 0 808.6325,756.4822 L808.6325,695.24 L798.6325,685.24 L605.78,685.24 L552.87,624.67 L597.78,685.24 L452.07,685.24 A0,0 0 0 0 452.07,685.24" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M798.6325,685.24 L798.6325,695.24 L808.6325,695.24 L798.6325,685.24" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.0361" x="458.07" y="702.8084">After END the worker runs the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="71.3223" x="652.2194" y="702.8084">shared tail</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="33.9727" x="727.655" y="702.8084">(as in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.5625" x="458.07" y="718.1189">the workflow mode): batched enrichment (ADR-042),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.897" x="458.07" y="733.4295">sort by date, flag the recurring delta (ADR-033),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.7168" x="458.07" y="748.74">then deliver &#8212; POST /internal/jobs/{id}/results.</text></g><!--link *start* to decide--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" data-link-type="dependency" data-source-line="16" id="lnk7"><path d="M702.36,67.12 C701.88,90.37 697.28,151.97 663.35,184.87 C632.86,214.42 594.9286,229.5205 554.3086,238.2405" fill="none" id="*start*-to-decide" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="549.42,239.29,559.0591,241.3119,554.3086,238.2405,557.38,233.4901,549.42,239.29" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.3188" x="745.2437" y="158.9384">invoke({goal})</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="14.2124" x="691.46" y="174.2489">or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.5605" x="709.7857" y="174.2489">Command(resume=answer)</text></g><!--link decide to search--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="18" id="lnk8"><path d="M311.16,266.97 C255.61,277.28 198.08,292.79 181.35,314.33 C164.16,336.48 171.6725,362.2 185.8625,386.55" fill="none" id="decide-to-search" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="188.38,390.87,187.3045,381.08,185.8625,386.55,180.3925,385.108,188.38,390.87" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98.1665" x="182.35" y="342.8984">action = search</text></g><!--link search to decide--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="22" id="lnk11"><path d="M260.18,391.13 C268.74,381.55 277.55,371.26 285.35,361.33 C300.97,341.46 298.74,331.43 317.35,314.33 C329.46,303.21 339.5536,295.7975 353.9336,287.2375" fill="none" id="search-to-decide" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="358.23,284.68,348.4505,285.8464,353.9336,287.2375,352.5425,292.7207,358.23,284.68" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.1123" x="347.9999" y="335.3984">back to the policy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.4121" x="318.35" y="350.7089">with the growing transcript</text></g><!--link decide to ask--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="19" id="lnk9"><path d="M426.68,214.58 C422.28,190.03 412.6,157.82 391.35,137.87 C355.66,104.35 332.12,122.36 285.35,107.87 C269.42,102.93 257.3463,99.0524 240.9863,93.6324" fill="none" id="decide-to-ask" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="236.24,92.06,243.5254,98.6874,240.9863,93.6324,246.0413,91.0933,236.24,92.06" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.4761" x="495.774" y="151.4384">action = ask</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.604" x="419.71" y="166.7489">(goal ambiguous, no clarification yet</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="148.8462" x="460.5889" y="182.0595">AND a clarifier is wired)</text></g><!--link ask to decide--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="dependency" data-source-line="23" id="lnk12"><path d="M123.65,91.97 C114.83,119.98 108.5,159.14 129.35,184.87 C152.43,213.35 232.3164,229.0076 306.0664,237.9576" fill="none" id="ask-to-decide" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="311.03,238.56,302.5774,233.5049,306.0664,237.9576,301.6137,241.4466,311.03,238.56" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.0527" x="130.35" y="158.9384">on resume: answer folded into the goal,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.7451" x="144.0038" y="174.2489">asked = true (one question per job)</text></g><!--link decide to finalize--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="20" id="lnk10"><path d="M475.31,284.74 C484.19,293.47 492.54,303.49 498.35,314.33 C514.09,343.68 517.8511,377.4719 518.5511,402.6519" fill="none" id="decide-to-finalize" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="518.69,407.65,522.4384,398.5423,518.5511,402.6519,514.4414,398.7646,518.69,407.65" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.1299" x="556.3949" y="327.8984">action = finish</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="14.2124" x="535.9142" y="343.2089">or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.7656" x="554.2399" y="343.2089">step budget spent</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="14.2124" x="514.84" y="358.5195">or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.9141" x="533.1657" y="358.5195">spend cap hit (ADR-048)</text></g><!--link finalize to critique--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="25" id="lnk13"><path d="M518.35,461.22 C518.35,482.48 518.35,508 518.35,532.81" fill="none" id="finalize-to-critique" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="518.35,537.81,5