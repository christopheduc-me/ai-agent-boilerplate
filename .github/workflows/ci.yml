# Primary CI (ADR-019): lint + test the three bricks, build images (published
# to GHCR on main/tags). This repository is a boilerplate: it deploys nothing —
# deployment to a VPS is documented for forks (TODO.md §4, and a reference
# deploy job in the .gitlab-ci.yml mirror).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- backend (Rust)
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: aiagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/aiagent
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Lint
        working-directory: backend
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Test (includes PostgreSQL integration tests)
        working-directory: backend
        run: cargo test

  # ---------------------------------------------------------------- agent (Python)
  agent:
    name: agent (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Sync dependencies
        working-directory: agent
        run: uv sync --frozen
      - name: Lint
        working-directory: agent
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Test
        working-directory: agent
        run: uv run pytest

  # ---------------------------------------------------------------- frontend (Vue)
  frontend:
    name: frontend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint + typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------- e2e (full stack)
  # Boots the fully containerized stack (compose --profile full) with the
  # deterministic fake providers (ADR-021, no API key) and drives the real user
  # journey through nginx: register -> login -> search -> worker -> sorted results.
  e2e:
    name: e2e (full compose stack)
    runs-on: ubuntu-latest
    needs: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          echo "AGENT_PROVIDERS=fake" >> .env
      - name: Boot the full stack
        run: docker compose --profile full up -d --build --wait
      - name: Run the smoke test
        run: scripts/e2e-smoke.sh http://localhost:8080
      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile full logs --tail=100
      - name: Teardown
        if: always()
        run: docker compose --profile full down -v

  # ---------------------------------------------------------------- images (GHCR)
  # PRs build without pushing (Dockerfile validation, no secrets needed — safe
  # for fork PRs). Pushes to main/tags publish sha + latest tags to GHCR.
  build:
    name: build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: [backend, agent, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, agent, frontend]
    steps:
      - uses: actions/checkout@v4
      # Docker Hub intermittently resets connections from shared runners.
      # mirror.gcr.io caches the official library images (anonymous, no rate
      # limit); buildkit falls back to docker.io if the mirror misses.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
