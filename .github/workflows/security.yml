# Weekly security audits (ADR-015 amendment / ADR-019): dependency
# vulnerabilities + secret scanning over the full git history, plus an
# outdated-dependencies report (ADR-022 — native tools, no platform bot).
# Also runnable on demand from the Actions tab (workflow_dispatch).
name: Security audits

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret committed then removed still leaks
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cargo-audit:
    name: cargo audit (Rust dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        working-directory: backend
        run: cargo audit

  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Audit
        working-directory: agent
        run: |
          uv export --frozen --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

  npm-audit:
    name: npm audit (frontend dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=high

  trivy:
    name: trivy ${{ matrix.component }} (image CVE scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: [backend, agent, frontend]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true # only actionable findings: a fix must exist

  deps-report:
    name: outdated dependencies report (informative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report
        run: scripts/deps-report.sh all
