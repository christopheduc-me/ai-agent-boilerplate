# MIRROR (ADR-019): GitHub Actions is the primary CI/CD (.github/workflows/).
# This file mirrors the same capabilities for GitLab-hosted forks and is NOT
# executed on GitHub. Keep both in sync when changing the pipeline.
#
# Monorepo pipeline (ADR-015): per-brick jobs triggered by path changes, linked as a DAG.
# lint -> test -> build -> publish -> deploy
# Scheduled pipelines run ONLY the security audit jobs (ADR-015 security hygiene).
stages:
  - lint
  - test
  - build
  - publish
  - deploy
  - audit

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Excludes a job from scheduled (audit-only) pipelines.
.not-on-schedule: &not-on-schedule
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

# ---------------------------------------------------------------- backend (Rust)
.backend-rules: &backend-rules
  rules:
    - *not-on-schedule
    - changes:
        - backend/**/*
        - .gitlab-ci.yml

backend:lint:
  stage: lint
  image: rust:1-slim
  <<: *backend-rules
  cache:
    key:
      files: [backend/Cargo.lock]
    paths: [backend/target/, .cargo/]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cd backend
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings

backend:test:
  stage: test
  image: rust:1-slim
  needs: ["backend:lint"]
  <<: *backend-rules
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: aiagent
    DATABASE_URL: postgres://app:app@postgres:5432/aiagent
    REDIS_URL: redis://redis:6379/0
  cache:
    key:
      files: [backend/Cargo.lock]
    paths: [backend/target/, .cargo/]
  before_script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked
  script:
    - cd backend
    - cargo llvm-cov --ignore-filename-regex 'src/(main\.rs|bin/)'
    - cargo llvm-cov report --summary-only --ignore-filename-regex 'src/(main\.rs|bin/)' | awk '/^TOTAL/ {print "COVERAGE:", $10}'
  coverage: '/COVERAGE: ([\d.]+)%/'

# ---------------------------------------------------------------- agent (Python)
.agent-rules: &agent-rules
  rules:
    - *not-on-schedule
    - changes:
        - agent/**/*
        - .gitlab-ci.yml

agent:lint:
  stage: lint
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  <<: *agent-rules
  cache:
    key:
      files: [agent/uv.lock]
    paths: [agent/.venv/]
  script:
    - cd agent
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy src

agent:test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  needs: ["agent:lint"]
  <<: *agent-rules
  cache:
    key:
      files: [agent/uv.lock]
    paths: [agent/.venv/]
  script:
    - cd agent
    - uv sync --frozen
    - uv run pytest --cov=aiagent --cov-report=term
  coverage: '/TOTAL.*? (\d+)%/'

# ---------------------------------------------------------------- frontend (Vue)
.frontend-rules: &frontend-rules
  rules:
    - *not-on-schedule
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml

frontend:lint:
  stage: lint
  image: node:22-alpine
  <<: *frontend-rules
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run typecheck

frontend:test:
  stage: test
  image: node:22-alpine
  needs: ["frontend:lint"]
  <<: *frontend-rules
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules/]
  script:
    - cd frontend
    - npm ci
    - npm test -- --coverage --coverage.reporter=text
  coverage: '/All files\s*\|\s*([\d.]+)/'

# ---------------------------------------------------------------- e2e (full stack)
# Full compose stack with fake providers (ADR-021) + smoke script through nginx.
e2e:
  stage: test
  image: docker:27-cli
  needs: []
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - *not-on-schedule
    - when: on_success
  before_script:
    - apk add --no-cache bash curl python3 docker-cli-compose
  script:
    - cp .env.example .env
    - echo "AGENT_PROVIDERS=fake" >> .env
    # Smoke + Playwright register several accounts within a minute (ADR-017).
    - echo "RATE_LIMIT_AUTH_PER_MINUTE=100" >> .env
    # Fast scheduler tick for the recurring-search scenario (ADR-033).
    - echo "SCHEDULER_TICK_SECONDS=5" >> .env
    - docker compose --profile full up -d --build --wait
    # Ports are published on the dind service host ("docker").
    - scripts/e2e-smoke.sh http://docker:8080
    # Browser tests (ADR-028) inside the official Playwright image, run on the
    # dind daemon: --network host shares dind's network, where the stack's
    # ports are published (nginx on :8080). $CI_PROJECT_DIR is not visible
    # from dind, so the sources are docker-cp'd in. Keep the image tag in
    # sync with @playwright/test in frontend/package.json.
    - >
      docker create --name playwright --network host
      -e CI=1 -e E2E_BASE_URL=http://localhost:8080
      mcr.microsoft.com/playwright:v1.61.1-noble
      bash -c "cd /repo/frontend && npm ci && npx playwright test"
    - docker cp "$CI_PROJECT_DIR" playwright:/repo
    - docker start -a playwright
  after_script:
    - docker compose --profile full logs --tail=100 || true

# ---------------------------------------------------------------- image builds (kaniko)
.kaniko-build: &kaniko-build
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$COMPONENT"
      --dockerfile "$CI_PROJECT_DIR/$COMPONENT/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      --cache=true
      --cache-repo "$CI_REGISTRY_IMAGE/$IMAGE_NAME/cache"
      --registry-mirror mirror.gcr.io
      $EXTRA_ARGS
  # On merge requests: build for validation without pushing.
  # On the default branch / tags: push SHA tag (publish stage adds `latest`).

backend:build:
  <<: *kaniko-build
  needs: ["backend:test"]
  variables:
    COMPONENT: backend
    IMAGE_NAME: backend
  rules:
    - *not-on-schedule
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**/*, .gitlab-ci.yml]
      variables: { EXTRA_ARGS: "--no-push" }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      changes: [backend/**/*, .gitlab-ci.yml]

agent:build:
  <<: *kaniko-build
  needs: ["agent:test"]
  variables:
    COMPONENT: agent
    IMAGE_NAME: agent
  rules:
    - *not-on-schedule
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [agent/**/*, .gitlab-ci.yml]
      variables: { EXTRA_ARGS: "--no-push" }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      changes: [agent/**/*, .gitlab-ci.yml]

frontend:build:
  <<: *kaniko-build
  needs: ["frontend:test"]
  variables:
    COMPONENT: frontend
    IMAGE_NAME: frontend
  rules:
    - *not-on-schedule
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*, .gitlab-ci.yml]
      variables: { EXTRA_ARGS: "--no-push" }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      changes: [frontend/**/*, .gitlab-ci.yml]

# ---------------------------------------------------------------- publish `latest`
.publish-latest: &publish-latest
  stage: publish
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  rules:
    - *not-on-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - crane auth login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - crane tag "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" latest

backend:publish:
  <<: *publish-latest
  needs: ["backend:build"]
  variables: { IMAGE_NAME: backend }

agent:publish:
  <<: *publish-latest
  needs: ["agent:build"]
  variables: { IMAGE_NAME: agent }

frontend:publish:
  <<: *publish-latest
  needs: ["frontend:build"]
  variables: { IMAGE_NAME: frontend }

# ---------------------------------------------------------------- deploy (VPS, manual)
deploy:vps:
  stage: deploy
  image: alpine:3.20
  rules:
    - *not-on-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "cd /opt/aiagent &&
       export CI_REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG='$CI_COMMIT_SHORT_SHA' &&
       docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile full pull &&
       docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile full up -d"

# ---------------------------------------------------------------- security audits (ADR-015)
# Run on the weekly schedule (Settings -> CI/CD -> Pipeline schedules) and on
# demand from the web UI. Never block merge requests.
.audit-rules: &audit-rules
  stage: audit
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

security:gitleaks:
  <<: *audit-rules
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0" # full history: a secret committed then removed still leaks
  script:
    - gitleaks detect --source . --no-banner --redact

security:cargo-audit:
  <<: *audit-rules
  image: rust:1-slim
  cache:
    key: cargo-audit-bin
    paths: [.cargo-audit/]
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-audit
  script:
    - command -v cargo-audit || cargo install cargo-audit --locked
    - cd backend
    - $CARGO_HOME/bin/cargo-audit audit

security:pip-audit:
  <<: *audit-rules
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - cd agent
    - uv export --frozen --no-emit-project -o /tmp/requirements.txt
    - uvx pip-audit -r /tmp/requirements.txt

security:npm-audit:
  <<: *audit-rules
  image: node:22-alpine
  script:
    - cd frontend
    - npm audit --audit-level=high

security:trivy:
  <<: *audit-rules
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$CI_REGISTRY_IMAGE/backend:latest"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$CI_REGISTRY_IMAGE/agent:latest"
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$CI_REGISTRY_IMAGE/frontend:latest"

# Outdated-dependencies report (ADR-022): informative, native tools only.
deps-report:cargo:
  <<: *audit-rules
  image: rust:1-slim
  script:
    - scripts/deps-report.sh backend

deps-report:uv:
  <<: *audit-rules
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  script:
    - scripts/deps-report.sh agent

deps-report:npm:
  <<: *audit-rules
  image: node:22-alpine
  before_script:
    - apk add --no-cache bash
  script:
    - scripts/deps-report.sh frontend
